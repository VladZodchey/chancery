[project]
name = "chancery"
dynamic = [ "version" ]
description = "Selfhosted paste store"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [ { name = "V. Zhdanov", email = "hi@vladzodchey.ru" } ]
maintainers = [ { name = "V. Zhdanov", email = "hi@vladzodchey.ru" } ]

requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "pynacl>=1.6.2",
    "slowapi>=0.1.10",
    "sqlcipher3-binary>=0.6.0",
    "typer>=0.27.0",
]

[project.scripts]
chancery = "chancery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "chancery.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chancery = ["py.typed"]
"chancery.web" = ["templates/*", "static/*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"src/chancery/cli.py" = ["B008"]
