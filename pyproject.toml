[project]
name = "chancery"
dynamic = [ "version" ]
description = "Selfhosted paste store"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [ { name = "V. Zhdanov", email = "hi@vladzodchey.ru" } ]
maintainers = [ { name = "V. Zhdanov", email = "hi@vladzodchey.ru" } ]

requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "typer>=0.27.0",
]

[project.scripts]
chancery = "chancery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "chancery.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
]
